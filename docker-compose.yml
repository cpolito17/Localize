services:
  backend:
    build: ./backend
    environment:
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    volumes:
      - cache-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${LOCALIZE_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cache-data:
